# Pushes the course (course.yaml and the lessons it names) to ML-Arena.
#
# Runs on every commit to main, and when you click "Run workflow" in the
# Actions tab. A run from the button is a dry run unless you untick dry_run:
# it prints the plan (what would be created, updated or orphaned) and changes
# nothing. The plan of every run is in its summary.
name: Push course to ML-Arena

on:
  push:
    branches: [main]
    # No path filter on purpose: GitHub skips a filtered workflow when a commit
    # changes more than 300 files (adding a whole course, moving its images). A
    # commit that changes no lesson pushes nothing: its plan reads "unchanged".
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the plan, change nothing
        type: boolean
        default: true

permissions:
  id-token: write   # the job proves its identity to ML-Arena: no secret to store
  contents: read    # to check out the repository

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ml-arena/mlarena-action@v1
        with:
          command: course-push
          # A push to main has no inputs, so it applies the course for real.
          dry-run: ${{ inputs.dry_run || false }}
          # One repository, several courses: the folder of this course.
          # path: my-course
          # Delete the lessons removed from course.yaml, with their students'
          # progress (default: unpublish them, keep the progress).
          # prune: true
