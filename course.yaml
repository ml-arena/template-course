# The course: its modules, its lessons and its challenges. Each commit on main
# pushes this folder to ML-Arena with the course's key (the repository secret
# MLARENA_COURSE_KEY): the key names the course, so this file needs no slug.
# Paths here (file, folder, cover) start from the folder of this file; a link
# inside a lesson starts from the lesson's folder. Visibility and dates are set
# in the console (Settings), not here. Every key: README.md.
course:
  # name: "My first course"    # optional: left out, the course keeps the name typed in ML-Arena
  description: "A short course kept in a GitHub repository."   # optional Markdown, shown on the course page
  # code: "ML101"              # optional
  # cover: cover.png           # optional cover image (PNG, JPEG, GIF or WebP)

modules:
  - title: "Introduction"      # required
    slug: intro                # required: the module's identity. Rename with renamed_from: <old slug>
    summary: "What this course is and how to follow it."   # optional
    # is_published: true       # default true; false hides the whole module from students
    lessons:
      - title: "Welcome"       # required
        slug: welcome          # required: the lesson's identity (students' progress follows it)
        file: intro/welcome.md # the lesson's Markdown (or body_md: inline text)
        is_published: true     # default false: a draft, hidden from students
        estimated_minutes: 10  # optional, shown to students
    challenges:                # the challenges of this module, in this order
      - name: "House prices"   # required: the challenge's identity in the course
        folder: challenges/house-prices   # its files: env.py, challenge.toml, data/, benchmark/…
        kernel_version: file_v1           # file_v1 | flex_v1 | chat_v1 | exercise_v1
        # pass_threshold: 10   # optional: the score that counts as passed
